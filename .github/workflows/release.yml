name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish AliSnow DMG
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building AliSnow ${VERSION} (tag: ${TAG})"

      - name: Show Xcode environment
        run: xcodebuild -version

      - name: Build Release .app and package .dmg
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh "${{ steps.meta.outputs.version }}"

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          shasum -a 256 "AliSnow-${{ steps.meta.outputs.version }}.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AliSnow ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## AliSnow ${{ steps.meta.outputs.tag }}

            Universal macOS build (**Apple Silicon & Intel**, macOS 14.0+).

            ### Install
            1. Download **`AliSnow-${{ steps.meta.outputs.version }}.dmg`** below.
            2. Open the `.dmg` and drag **AliSnow** into **Applications**.
            3. Launch **AliSnow** from Applications or Spotlight.

            > **First launch note (unsigned indie build):** If macOS Gatekeeper warns that AliSnow is from an unidentified developer, open **System Settings → Privacy & Security** and click **Open Anyway** once.
          files: |
            dist/AliSnow-${{ steps.meta.outputs.version }}.dmg
            dist/SHA256SUMS.txt
